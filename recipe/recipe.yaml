context:
  version: "0.2.1"
  python_min: "3.11"

package:
  name: spaday-lightweight-charts
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-lightweight-charts/spaday_lightweight_charts-${{ version }}.tar.gz
  sha256: 68a474e1a95316f6ec0e580ec462cf47c1df3f6ec4df75004f9c3e317da2b26e

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.6.0

tests:
  - python:
      imports:
        - spaday_lightweight_charts
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: TradingView Lightweight Charts for spaday
  homepage: https://github.com/1kbgz/spaday-lightweight-charts
  repository: https://github.com/1kbgz/spaday-lightweight-charts

extra:
  recipe-maintainers:
    - timkpaine
